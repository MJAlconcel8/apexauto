spring.application.name=apexauto

# Railway injects PORT dynamically. The fallbacks keep local development unchanged.
server.address=0.0.0.0
server.port=${PORT:8080}
server.forward-headers-strategy=framework

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Never use create-drop with a persistent Railway database.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}

security.jwt.secret-key=${JWT_SECRET_KEY}
security.jwt.expiration-time=${JWT_EXPIRATION_TIME:2592000000}

# Comma-separated Spring origin patterns. Use exact HTTPS origins in Railway.
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGINS:http://localhost:*}

# Railway + Vercel default domains: true + None. Local HTTP: false + Lax.
# auto derives Secure from the request after forwarded-header processing.
app.auth.cookie-secure=${AUTH_COOKIE_SECURE:auto}
app.auth.cookie-same-site=${AUTH_COOKIE_SAME_SITE:auto}

spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.test-connection=false

gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.1-flash-lite}
chatbot.max-output-tokens=${CHATBOT_MAX_OUTPUT_TOKENS:300}
